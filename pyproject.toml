[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "search-citation-mcp"
version = "1.1.2"
authors = [{ name = "isaacwars", email = "isaacwars@users.noreply.github.com" }]
description = "Academic paper search and IEEE citation engine — MCP server with 9 tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "bibtex",
    "ieee",
    "academic",
    "citation",
    "paper-search",
    "openalex",
    "crossref",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "mcp>=1.2.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.28.0",
    "curl-cffi>=0.7.0",
    "python-dotenv>=1.0.0",
    "bibtexparser>=2.0.0b7",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/isaacwars/search-citation-mcp"
Repository = "https://github.com/isaacwars/search-citation-mcp"
Issues = "https://github.com/isaacwars/search-citation-mcp/issues"

[project.scripts]
search-citation = "search_citation_mcp.cli:main"
search-citation-mcp = "search_citation_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/search_citation_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
